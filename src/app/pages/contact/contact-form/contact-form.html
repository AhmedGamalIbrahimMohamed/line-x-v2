<form class="contact-form" aria-label="Project inquiry form">
  <p class="contact-form__eyebrow">Project Inquiry</p>
  <p class="contact-form__intro">
    Fill out the form below and our team will get back to you within 24 hours.
  </p>

  <div class="contact-form__grid">
    <label class="field">
      <span>Full Name</span>
      <input type="text" name="fullName" placeholder="Enter Full Name" autocomplete="name" />
    </label>

    <label class="field">
      <span>Company</span>
      <input type="text" name="company" placeholder="Enter Company" autocomplete="organization" />
    </label>

    <label class="field">
      <span>Email Address</span>
      <input type="email" name="email" placeholder="Enter Email Address" autocomplete="email" />
    </label>

    <label class="field">
      <span>Phone Number</span>
      <input type="tel" name="phone" placeholder="Enter Phone Number" autocomplete="tel" />
    </label>

    <label class="field field--full field--select">
      <span>Project Type</span>
      <select name="projectType" aria-label="Project Type">
        <option value="">Select Project Type</option>
        <option value="residential">Residential</option>
        <option value="commercial">Commercial</option>
        <option value="hospitality">Hospitality</option>
        <option value="masterplan">Masterplan</option>
      </select>
    </label>

    <label class="field field--full field--textarea">
      <span>Project Details</span>
      <textarea
        name="projectDetails"
        placeholder="Tell Us About Your Vision, Timeline, Budget....."
      ></textarea>
    </label>
  </div>

  <button class="contact-form__submit" type="submit">Start a Conversation</button>
</form>
