<form class="contact-form" aria-label="Project inquiry form" #formRef>
  <p class="contact-form__eyebrow">{{ 'Contact.form.eyebrow' | translate }}</p>
  <p class="contact-form__intro">
    {{ 'Contact.form.intro' | translate }}
  </p>

  <div class="contact-form__grid">
    <label class="field">
      <span>{{ 'Contact.form.Full Name' | translate }}</span>
      <input type="text" name="fullName" [placeholder]="'Contact.form.Enter Full Name' | translate" autocomplete="name" />
    </label>

    <label class="field">
      <span>{{ 'Contact.form.Company' | translate }}</span>
      <input type="text" name="company" [placeholder]="'Contact.form.Enter Company' | translate" autocomplete="organization" />
    </label>

    <label class="field">
      <span>{{ 'Contact.form.Email Address' | translate }}</span>
      <input type="email" name="email" [placeholder]="'Contact.form.Enter Email Address' | translate" autocomplete="email" />
    </label>

    <label class="field">
      <span>{{ 'Contact.form.Phone Number' | translate }}</span>
      <input type="tel" name="phone" [placeholder]="'Contact.form.Enter Phone Number' | translate" autocomplete="tel" />
    </label>

    <label class="field field--full field--select">
      <span>{{ 'Contact.form.Project Type' | translate }}</span>
      <select name="projectType" [attr.aria-label]="'Contact.form.Project Type' | translate">
        <option value="">{{ 'Contact.form.Select Project Type' | translate }}</option>
        <option value="residential">{{ 'Contact.form.Residential' | translate }}</option>
        <option value="commercial">{{ 'Contact.form.Commercial' | translate }}</option>
        <option value="hospitality">{{ 'Contact.form.Hospitality' | translate }}</option>
        <option value="masterplan">{{ 'Contact.form.Masterplan' | translate }}</option>
      </select>
    </label>

    <label class="field field--full field--textarea">
      <span>{{ 'Contact.form.Project Details' | translate }}</span>
      <textarea
        name="projectDetails"
        [placeholder]="'Contact.form.Project Details Placeholder' | translate"
      ></textarea>
    </label>
  </div>

  <button class="contact-form__submit" type="submit">{{ 'Contact.form.Start a Conversation' | translate }}</button>
</form>
