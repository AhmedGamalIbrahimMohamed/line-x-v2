<form class="contact-form" aria-label="Project inquiry form" #formRef (submit)="onSubmit($event)">
  <p class="contact-form__eyebrow">{{ 'Contact.form.eyebrow' | translate }}</p>
  <p class="contact-form__intro">
    {{ 'Contact.form.intro' | translate }}
  </p>

  <div class="contact-form__grid">
    <label class="field">
      <span>{{ 'Contact.form.Full Name' | translate }}</span>
      <input type="text" name="fullName" [placeholder]="'Contact.form.Enter Full Name' | translate" autocomplete="name" required />
    </label>

    <label class="field">
      <span>{{ 'Contact.form.Company' | translate }}</span>
      <input type="text" name="company" [placeholder]="'Contact.form.Enter Company' | translate" autocomplete="organization" required />
    </label>

    <label class="field">
      <span>{{ 'Contact.form.Email Address' | translate }}</span>
      <input type="email" name="email" [placeholder]="'Contact.form.Enter Email Address' | translate" autocomplete="email" required />
    </label>

    <label class="field">
      <span>{{ 'Contact.form.Phone Number' | translate }}</span>
      <input type="tel" name="phone" [placeholder]="'Contact.form.Enter Phone Number' | translate" autocomplete="tel" required />
    </label>

    <label class="field field--full field--select">
      <span>{{ 'Contact.form.Project Type' | translate }}</span>
      <select name="projectType" [attr.aria-label]="'Contact.form.Project Type' | translate">
        <option value="">{{ 'Contact.form.Select Project Type' | translate }}</option>
        <option value="residential">{{ 'Contact.form.Residential' | translate }}</option>
        <option value="commercial">{{ 'Contact.form.Commercial' | translate }}</option>
        <option value="hospitality">{{ 'Contact.form.Hospitality' | translate }}</option>
        <option value="masterplan">{{ 'Contact.form.Masterplan' | translate }}</option>
      </select>
    </label>

    <label class="field field--full field--textarea">
      <span>{{ 'Contact.form.Project Details' | translate }}</span>
      <textarea
        name="projectDetails"
        [placeholder]="'Contact.form.Project Details Placeholder' | translate"
      ></textarea>
    </label>
  </div>

  <button class="contact-form__submit" type="submit" [disabled]="isSubmitting()">
    {{ (isSubmitting() ? 'Contact.form.Sending' : 'Contact.form.Start a Conversation') | translate }}
  </button>
</form>

@if (toast()) {
  <div class="contact-toast" [class.contact-toast--error]="toast()!.type === 'error'" role="status" aria-live="polite">
    <span class="contact-toast__icon"></span>
    <span class="contact-toast__message">{{ toast()!.message | translate }}</span>
    <button class="contact-toast__close" type="button" (click)="dismissToast()" aria-label="Dismiss">&times;</button>
  </div>
}
