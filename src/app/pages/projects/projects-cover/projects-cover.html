<section class="projects-cover" aria-label="Project highlight cover" #sectionRef>
	<img
		class="projects-cover__image"
		src="assets/images/figma2/projects-cover/cover-desktop.jpg"
		alt=""
		aria-hidden="true"
	/>
	<div class="projects-cover__overlay" aria-hidden="true"></div>

	<div class="projects-cover__content layout-container">
		<ul class="projects-cover__stats" aria-label="Project highlights">
			<li class="projects-cover__stat projects-cover__stat--projects">
				<img
					class="projects-cover__icon"
					src="https://www.figma.com/api/mcp/asset/5562625f-bb9e-4c44-8ffd-019c6cbdb85e"
					alt=""
				/>
				<span class="projects-cover__value">+1000</span>
				<span class="projects-cover__label">{{ 'Projects.cover.Projects Completed' | translate }}</span>
			</li>
			<li class="projects-cover__stat projects-cover__stat--awards">
				<img
					class="projects-cover__icon"
					src="https://www.figma.com/api/mcp/asset/4312772b-85f0-4250-9909-49d80a94d62c"
					alt=""
				/>
				<span class="projects-cover__value">4</span>
				<span class="projects-cover__label">{{ 'Projects.cover.Global Awards' | translate }}</span>
			</li>
			<li class="projects-cover__stat projects-cover__stat--countries">
				<img
					class="projects-cover__icon"
					src="https://www.figma.com/api/mcp/asset/4312772b-85f0-4250-9909-49d80a94d62c"
					alt=""
				/>
				<span class="projects-cover__value">18</span>
				<span class="projects-cover__label">{{ 'Projects.cover.Countries' | translate }}</span>
			</li>
			<li class="projects-cover__stat projects-cover__stat--sustainable">
				<img
					class="projects-cover__icon"
					src="https://www.figma.com/api/mcp/asset/e9956944-b4bd-498b-9ea8-4faa3aa0ea56"
					alt=""
				/>
				<span class="projects-cover__value">100%</span>
				<span class="projects-cover__label">{{ 'Projects.cover.Sustainable Focus' | translate }}</span>
			</li>
		</ul>
	</div>
</section>
