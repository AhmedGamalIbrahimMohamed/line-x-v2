<section class="selected-project" aria-labelledby="selected-project-title">
  <div class="selected-project__background" aria-hidden="true">
    <img
      class="selected-project__media selected-project__media--layer-1"
      src="assets/images/figma2/selected-project/hero-layer-1.jpg"
      alt=""
    />
    <img
      class="selected-project__media selected-project__media--layer-2"
      src="assets/images/figma2/selected-project/hero-layer-2.jpg"
      alt=""
    />
    <img
      class="selected-project__media selected-project__media--layer-3"
      src="assets/images/figma2/selected-project/hero-layer-3.jpg"
      alt=""
    />
    <img
      class="selected-project__media selected-project__media--base"
      src="assets/images/figma2/selected-project/hero-base.jpg"
      alt=""
    />
    <div class="selected-project__overlay"></div>
  </div>

  <div class="selected-project__hero">
    <p class="selected-project__eyebrow">Architecture Case study</p>
    <h1 class="selected-project__title" id="selected-project-title">The Ramllah Hotel</h1>
    <p class="selected-project__subtitle">Strategic Architecture for Modern Business</p>
  </div>

  <div class="selected-project__scroll" aria-hidden="true">
    <div class="selected-project__scroll-dot"></div>
  </div>

  <dl class="selected-project__details" aria-label="Project details">
    <div class="selected-project__detail">
      <dt>Location</dt>
      <dd>JEDDAH . KSA</dd>
    </div>
    <div class="selected-project__detail">
      <dt>Total Area</dt>
      <dd>12,500 sq.ft.</dd>
    </div>
    <div class="selected-project__detail">
      <dt>
        <span class="selected-project__label-desktop">Year</span>
        <span class="selected-project__label-mobile">2024</span>
      </dt>
      <dd>2024</dd>
    </div>
    <div class="selected-project__detail">
      <dt>Scope</dt>
      <dd>Architecture &amp; Interior</dd>
    </div>
  </dl>
</section>
