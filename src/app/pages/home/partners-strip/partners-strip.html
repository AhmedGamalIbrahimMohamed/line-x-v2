<section class="partners-strip" aria-label="Partner logos" #sectionRef>
  <div class="partners-strip__track">
    <div class="partners-strip__group">
      @for (logo of logos; track logo) {
        <div class="partners-strip__item">
          <img [src]="'assets/images/partners/' + logo + '.svg'" alt="Partner logo" loading="eager" />
        </div>
      }
    </div>
    <div class="partners-strip__group" aria-hidden="true">
      @for (logo of logos; track logo) {
        <div class="partners-strip__item">
          <img [src]="'assets/images/partners/' + logo + '.svg'" alt="" loading="eager" />
        </div>
      }
    </div>
  </div>
</section>
