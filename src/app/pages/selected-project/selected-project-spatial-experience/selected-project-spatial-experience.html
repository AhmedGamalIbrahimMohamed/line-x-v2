<section class="solutions" aria-labelledby="selected-project-solutions-title" #sectionRef>
  <div class="solutions__stage" data-node-id="179:6668">
    <div class="solutions__media" aria-hidden="true">
      <img
        [src]="solutions.image"
        alt=""
      />
    </div>

    <div class="solutions__copy">
      <h2 class="solutions__title" id="selected-project-solutions-title">{{ solutions.title | localize }}</h2>
      <p class="solutions__text">
        {{ solutions.text | localize }}
      </p>
    </div>
  </div>
</section>
