<section class="about-approach" aria-labelledby="about-approach-title">
  <div class="about-approach__inner layout-container">
    <div class="about-approach__header">
      <p class="about-approach__eyebrow">{{ 'About.integratedApproach.eyebrow' | translate }}</p>
      <h2 id="about-approach-title">{{ 'About.integratedApproach.title' | translate }}</h2>
      <p class="about-approach__intro">
        {{ 'About.integratedApproach.intro' | translate }}
      </p>
    </div>

    <div class="about-approach__steps">
      @for (step of steps; track step.number) {
        <article class="approach-card">
          <div class="approach-card__number">{{ step.number }}</div>
          <div class="approach-card__text">
            <h3>{{ step.title | translate }}</h3>
            <p>{{ step.description | translate }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
