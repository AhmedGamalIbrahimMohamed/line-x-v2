<section class="projects-list" aria-label="Projects gallery">
  <div class="projects-list__inner layout-container">
    <div class="projects-tabs" role="tablist" aria-label="Project categories">
      <button class="projects-tabs__item projects-tabs__item--active" type="button" role="tab" aria-selected="true">
        {{ 'Projects.section.All Projects' | translate }}
      </button>
      <button class="projects-tabs__item" type="button" role="tab" aria-selected="false">
        {{ 'Projects.section.Administrative' | translate }}
      </button>
      <button class="projects-tabs__item" type="button" role="tab" aria-selected="false">
        {{ 'Projects.section.Commercial' | translate }}
      </button>
      <button class="projects-tabs__item" type="button" role="tab" aria-selected="false">
        {{ 'Projects.section.Interior Design' | translate }}
      </button>
      <button class="projects-tabs__item" type="button" role="tab" aria-selected="false">
        {{ 'Projects.section.Entertainment' | translate }}
      </button>
      <button class="projects-tabs__item" type="button" role="tab" aria-selected="false">
        {{ 'Projects.section.Landscape' | translate }}
      </button>
      <button class="projects-tabs__item" type="button" role="tab" aria-selected="false">
        {{ 'Projects.section.Residential' | translate }}
      </button>
    </div>

    <div class="projects-list__grid">
      <a routerLink="/selected-project" class="project-card project-card-large">
        <img src="assets/images/figma2/projects-6b.jpg" alt="The Ramlah Hotel" />
        <div class="project-overlay"></div>
        <div class="project-content">
          <span class="project-line"></span>
          <div>
            <h2 class="project-title">The Ramlah Hotel</h2>
            <p class="project-meta">JEDDAH . KSA . 899.99 M²</p>
          </div>
        </div>
      </a>

      <a routerLink="/selected-project" class="project-card project-card-small">
        <img src="assets/images/figma2/projects-4.jpg" alt="Madar Tower" />
        <div class="project-overlay"></div>
        <div class="project-content">
          <span class="project-line"></span>
          <div>
            <h2 class="project-title">Madar Tower</h2>
            <p class="project-meta">RIYADH . KSA</p>
          </div>
        </div>
      </a>

      <a routerLink="/selected-project" class="project-card project-card-full">
        <img src="assets/images/figma2/projects-2.jpg" alt="Masterplan Project" />
        <div class="project-overlay"></div>
        <div class="project-content">
          <span class="project-line"></span>
          <div>
            <h2 class="project-title">Masterplan Project</h2>
            <p class="project-meta">JEDDAH . KSA . 899.99 M²</p>
          </div>
        </div>
      </a>

      <a routerLink="/selected-project" class="project-card project-card-large">
        <img src="assets/images/figma2/projects-5.jpg" alt="Mali Tower" />
        <div class="project-overlay"></div>
        <div class="project-content">
          <span class="project-line"></span>
          <div>
            <h2 class="project-title">Mali Tower</h2>
            <p class="project-meta">JEDDAH . KSA . 899.99 M²</p>
          </div>
        </div>
      </a>

      <a routerLink="/selected-project" class="project-card project-card-small">
        <img src="assets/images/figma2/projects-3.jpg" alt="Zara Branch" />
        <div class="project-overlay"></div>
        <div class="project-content">
          <span class="project-line"></span>
          <div>
            <h2 class="project-title">Zara Branch</h2>
            <p class="project-meta">RIYADH . KSA</p>
          </div>
        </div>
      </a>

      <a routerLink="/selected-project" class="project-card project-card-full">
        <img src="assets/images/figma2/projects-1.jpg" alt="Modern Villa" />
        <div class="project-overlay"></div>
        <div class="project-content">
          <span class="project-line"></span>
          <div>
            <h2 class="project-title">Modern Villa</h2>
            <p class="project-meta">JEDDAH . KSA . 899.99 M²</p>
          </div>
        </div>
      </a>
    </div>

    <button class="projects-list__load-more" type="button">{{ 'Projects.section.Load More' | translate }}</button>
  </div>
</section>
