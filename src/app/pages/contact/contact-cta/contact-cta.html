<section class="contact-cta" aria-labelledby="contact-cta-title" #sectionRef>
  <div class="contact-cta__inner layout-container">
    <div class="contact-cta__content">
      <h2 id="contact-cta-title" class="contact-cta__title">
        <span>{{ 'Contact.cta.titleLine1' | translate }}</span>
        <strong>{{ 'Contact.cta.titleLine2' | translate }}</strong>
      </h2>

      <p class="contact-cta__text">{{ 'Contact.cta.text' | translate }}</p>

      <a
        class="contact-cta__button"
        href="https://wa.me/1123456789"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Chat with us on WhatsApp"
      >
        <i class="fi fi-brands-whatsapp contact-cta__wa-icon" aria-hidden="true"></i>
        <span>{{ 'Contact.cta.Chat With Us' | translate }}</span>
      </a>
    </div>
  </div>
</section>
