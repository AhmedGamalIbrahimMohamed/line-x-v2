<section class="expertise-section" #expertiseSection>
  <div class="expertise-stage">

    <div class="expertise-section__media">
      @for (slide of slides; track $index) {
        <img
          [src]="slide.image"
          [alt]="slide.subtitle"
          [class.is-active]="$index === activeIndex"
        />
      }
    </div>

    <div class="expertise-section__content">
      <div class="expertise-section__main">

        <div class="expertise-section__heading">
          <p class="expertise-section__eyebrow">OUR EXPERTIES</p>
          <h2 class="expertise-section__title">
            <span class="expertise-section__title-bold">Design</span>
            <span class="expertise-section__title-light">&amp; Build</span>
          </h2>
        </div>

        <div class="expertise-section__text-block">
          <h3 class="expertise-section__subtitle">{{ slides[activeIndex].subtitle }}</h3>
          <p class="expertise-section__description">{{ slides[activeIndex].description }}</p>
        </div>

        <a routerLink="/projects" class="expertise-section__button">Explore Projects</a>
      </div>

      <div class="expertise-section__steps" aria-label="Expertise categories">
        @for (slide of slides; track $index) {
          <div
            class="expertise-section__step"
            [class.expertise-section__step--active]="$index === activeIndex"
            (click)="selectStep($index)"
          >{{ stepLabel($index) }}</div>
        }
      </div>
    </div>

  </div>
</section>
