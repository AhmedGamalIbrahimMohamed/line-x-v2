<section class="cta-section layout-container">
  <div class="cta-section__content">
    <h2 class="cta-section__title">
      <span class="cta-section__title-light">{{ 'Home.cta.titleLight' | translate }}</span>
      <span class="cta-section__title-bold">{{ 'Home.cta.titleBold' | translate }}</span>
    </h2>

    <p class="cta-section__description">
      {{ 'Home.cta.description' | translate }}
    </p>

    <div class="cta-section__actions">
      <button type="button" class="cta-section__button cta-section__button--primary">
        {{ 'Home.cta.Explore Projects' | translate }}
      </button>

      <button type="button" class="cta-section__button cta-section__button--secondary">
        {{ 'Home.cta.Contact Us' | translate }}
      </button>
    </div>
  </div>
</section>
